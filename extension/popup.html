<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bookmark &amp; History Backup</title>
<style>
  :root {
    --bg: #ffffff; --border: #e3e6ea; --text: #1b1f24; --muted: #626c76;
    --accent: #2563eb; --ok: #15803d; --warn: #b45309; --err: #b91c1c; --field: #f6f7f9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e2227; --border: #2f353c; --text: #e6e9ec; --muted: #98a2ad;
      --accent: #5b93ff; --ok: #4ade80; --warn: #fbbf24; --err: #f87171; --field: #16191d;
    }
  }
  * { box-sizing: border-box; }
  body {
    width: 360px; margin: 0; padding: 14px; background: var(--bg); color: var(--text);
    font: 13px/1.5 system-ui, "Segoe UI", sans-serif;
  }
  .head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .head strong { font-size: 14px; }
  .head a { color: var(--muted); text-decoration: none; font-size: 12px; }
  .head a:hover { color: var(--accent); }
  .status { display: flex; gap: 8px; align-items: flex-start; padding: 9px 11px; border-radius: 8px; background: var(--field); }
  .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--muted); }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.err { background: var(--err); }
  .status .txt { flex: 1; min-width: 0; }
  .muted { color: var(--muted); font-size: 12px; }
  .buttons { display: flex; gap: 8px; margin: 10px 0; }
  button {
    font: inherit; flex: 1; padding: 7px 10px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .55; cursor: default; }
  input[type=search] {
    font: inherit; width: 100%; padding: 7px 10px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--field); color: var(--text);
  }
  .list { margin-top: 8px; max-height: 260px; overflow-y: auto; }
  .hit { padding: 7px 2px; border-top: 1px solid var(--border); }
  .hit .when { color: var(--ok); font-weight: 600; font-variant-numeric: tabular-nums; }
  .hit .url { word-break: break-all; }
  .hit .url a { color: var(--text); text-decoration: none; }
  .hit .url a:hover { color: var(--accent); text-decoration: underline; }
  .msg { margin-top: 8px; font-size: 12px; }
  .m-ok { color: var(--ok); } .m-err { color: var(--err); }
</style>
</head>
<body>
  <div class="head">
    <strong>Bookmark &amp; History Backup</strong>
    <a href="#" id="linkOptions">Settings</a>
  </div>

  <div class="status">
    <span class="dot" id="dot"></span>
    <div class="txt">
      <div id="statusText">…</div>
      <div class="muted" id="statusSub"></div>
    </div>
  </div>

  <div class="buttons">
    <button class="primary" id="btnBackup">Back up now</button>
  </div>
  <div id="msg" class="msg"></div>

  <input type="search" id="search" placeholder="When was I on …?" autocomplete="off">
  <div class="list" id="list"></div>

<script type="module" src="popup.js"></script>
</body>
</html>
