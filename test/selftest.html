<!DOCTYPE html><meta charset="utf-8"><title>selftest</title>
<pre id="out">running…</pre>
<script>
  // Minimal chrome API stub so the modules can be imported outside an extension.
  const store = {};
  window.chrome = {
    storage: { local: {
      get: k => Promise.resolve(typeof k === "string" ? { [k]: store[k] } :
            Array.isArray(k) ? Object.fromEntries(k.map(x => [x, store[x]])) : { ...store }),
      set: o => { Object.assign(store, o); return Promise.resolve(); },
      remove: k => { for (const x of [].concat(k)) delete store[x]; return Promise.resolve(); }
    }},
    bookmarks: { getTree: () => Promise.resolve(FAKE_TREE) },
    history: {
      search: () => Promise.resolve(FAKE_HIST),
      getVisits: ({ url }) => Promise.resolve(FAKE_VISITS[url] || [])
    },
    alarms: { create: () => {}, get: () => Promise.resolve(null), onAlarm: { addListener(){} } },
    action: { setBadgeText: () => Promise.resolve(), setBadgeBackgroundColor: () => Promise.resolve() },
    runtime: { onMessage: { addListener(){} }, onInstalled: { addListener(){} }, onStartup: { addListener(){} } }
  };

  const T = Date.UTC(2026, 8, 13, 10, 0, 0);
  window.FAKE_TREE = [{ id: "0", children: [
    { id: "1", title: "Bookmarks bar", dateAdded: T - 9e8, dateGroupModified: T, children: [
      { id: "5", title: 'Anthropic & "Claude"', url: "https://www.anthropic.com/?a=1&b=<2>", dateAdded: T - 5e8 },
      { id: "6", title: "Folder with umlauts äöü", dateAdded: T - 4e8, children: [
        { id: "7", title: "GitHub", url: "https://github.com/anthropics/claude-code", dateAdded: T - 3e8 }
      ]}
    ]},
    { id: "2", title: "Other bookmarks", dateAdded: T - 9e8, children: [] }
  ]}];
  window.FAKE_HIST = [
    { url: "https://github.com/anthropics/claude-code", title: "claude-code", lastVisitTime: T, visitCount: 42 },
    { url: "https://www.example.com/path?q=1", title: "Example", lastVisitTime: T - 3600e3, visitCount: 3 }
  ];
  window.FAKE_VISITS = {
    "https://github.com/anthropics/claude-code": [
      { visitTime: T - 200 * 864e5 + 0.456 }, { visitTime: T - 3600e3 }, { visitTime: T }
    ],
    "https://www.example.com/path?q=1": [{ visitTime: T - 3600e3 }]
  };
</script>
<script type="module">
const out = [];
const log = s => { out.push(s); document.getElementById("out").textContent = out.join("\n"); };
let fails = 0;
const check = (name, got, want) => {
  const ok = String(got) === String(want);
  if (!ok) fails++;
  log(`${ok ? "PASS" : "FAIL"}  ${name}${ok ? "" : `  got=${got}  want=${want}`}`);
};

const base = "../extension/";
const files = ["lib/db.js", "lib/collect.js", "lib/log.js", "lib/run.js", "lib/ui.js",
               "options.js", "popup.js", "sw.js"].map(f => base + f);
const mods = {};
for (const f of files) {
  try { mods[f] = await import(f); log(`PASS  parse ${f}`); }
  catch (e) {
    if (e instanceof SyntaxError) { fails++; log(`FAIL  parse ${f}: SYNTAX ${e.message}`); }
    else log(`PASS  parse ${f}  (runtime ${e.name}, expected without DOM)`);
  }
}

log("");
const C = mods[base + "lib/collect.js"], D = mods[base + "lib/db.js"], U = mods[base + "lib/ui.js"];

const bm = await C.collectBookmarks();
check("bookmarks: links", bm.stats.links, 2);
check("bookmarks: folders", bm.stats.folders, 3);
check("netscape: escapes &", bm.html.includes("?a=1&amp;b=&lt;2&gt;"), true);
check("netscape: toolbar flag", bm.html.includes('PERSONAL_TOOLBAR_FOLDER="true"'), true);
check("json: english keys", Object.keys(JSON.parse(bm.json)).join(","), "exportedAt,stats,tree");

const from = Date.UTC(2026, 8, 13, 0, 0, 0), to = Date.UTC(2026, 8, 14, 0, 0, 0);
const h = await C.collectHistory(from, to);
check("history: visits in window", h.visits.length, 3);
check("history: index rows", h.index.length, 2);
check("history: first visit backdated 200d", new Date(h.index[0].first).toISOString(), "2026-02-25T10:00:00.000Z");

const csv = C.indexToCsv(h.index);
check("csv: english header", csv.split("\r\n")[0].replace(/^﻿/, ""), "first_visit;last_visit;visits;host;title;url");
const jsonl = C.indexToJsonl(h.index);
const first = JSON.parse(jsonl.split("\n")[0]);
check("jsonl: english keys", Object.keys(first).join(","), "url,host,title,firstVisit,lastVisit,visits");

check("searchKey: strips scheme+www", D.searchKey("https://www.GitHub.com/xyz/"), "github.com/xyz/");
check("searchKey: keeps path+query", D.searchKey("http://example.com/p?q=1"), "example.com/p?q=1");
check("timeAgo: 200 days", U.timeAgo(Date.now() - 200 * 864e5), "7 months ago");
check("formatDate", U.formatDate(Date.UTC(2026, 0, 5, 12)), "2026-01-05");

// The JSONL must round-trip through importIndex - same field names both ways.
const back = jsonl.split("\n").filter(Boolean).map(l => JSON.parse(l));
check("roundtrip: firstVisit parses", isNaN(Date.parse(back[0].firstVisit)), false);

// ---- individual visits ----
check("history: allVisits collected", h.allVisits.length, 4);
const vj = C.visitsToJsonl(h.allVisits);
const vFirst = JSON.parse(vj.split("\n")[0]);
check("visits jsonl: keys", Object.keys(vFirst).join(","), "url,at");
check("visits jsonl: oldest first", vFirst.at, "2026-02-25T10:00:00.000Z");
check("visits jsonl: roundtrip parses", isNaN(Date.parse(vFirst.at)), false);

// Real IndexedDB below - the store, the composite key and idempotency.
await D.clearVisits();
const years = await D.mergeVisits(h.allVisits);
check("mergeVisits: years touched", [...years].sort().join(","), "2026");
check("countVisits after first merge", await D.countVisits(), 4);
await D.mergeVisits(h.allVisits);
check("countVisits after re-run (idempotent)", await D.countVisits(), 4);
const forUrl = await D.visitsForUrl("https://github.com/anthropics/claude-code");
check("visitsForUrl: count", forUrl.length, 3);
check("visitsForUrl: sorted oldest first", forUrl[0] < forUrl[2], true);
check("visitsInYear 2026", (await D.visitsInYear(2026)).length, 4);
check("visitsInYear 2025", (await D.visitsInYear(2025)).length, 0);
await D.clearVisits();

// ---- daily log carries the full date per line ----
const txt = C.historyToText("2026-09-13", h.visits);
const firstLine = txt.split("\r\n")[5];
check("daily log: line starts with date", /^2026-09-13 \d{2}:\d{2}:\d{2}  /.test(firstLine), true);

// ---- one-off backfill groups visits by calendar day ----
const bf = await C.collectAllHistory({ days: 300 });
check("backfill: unique urls", bf.urls, 2);
check("backfill: visits found", bf.allVisits.length, 4);
check("backfill: days covered", bf.byDay.size, 2);
check("backfill: has the february day", bf.byDay.has("2026-02-25"), true);
check("backfill: day sorted oldest first",
      bf.byDay.get("2026-09-13")[0].t <= bf.byDay.get("2026-09-13").at(-1).t, true);

// ---- pruning must never remove the last remaining snapshot ----
const R = mods[base + "lib/run.js"];
const sept = d => new Date(2026, 8, d).getTime();
const two = ["bookmarks-2026-09-01.json", "bookmarks-2026-09-01.html",
             "bookmarks-2026-09-10.json", "bookmarks-2026-09-10.html"];
check("prune: drops the older date", R.selectPrunable(two, sept(5)).sort().join(","),
      "bookmarks-2026-09-01.html,bookmarks-2026-09-01.json");
check("prune: spares both files of the newest date",
      R.selectPrunable(two, sept(5)).some(f => f.includes("09-10")), false);

// The case that matters: nothing changed for longer than the retention window,
// so every file on disk is past the cutoff. Deleting them all would leave the
// user with no bookmark backup at all.
const stale = ["bookmarks-2026-01-02.json", "bookmarks-2026-01-02.html"];
check("prune: last snapshot survives an expired window", R.selectPrunable(stale, sept(1)).length, 0);
check("prune: leaves undated files alone", R.selectPrunable(["page-index.csv"], sept(1)).length, 0);
check("prune: empty folder", R.selectPrunable([], sept(1)).length, 0);

// The hash is what decides whether the bookmarks changed at all.
const bmHtml = (await C.collectBookmarks()).html;
check("sha256: stable", await R.sha256(bmHtml), await R.sha256(bmHtml));
check("sha256: reacts to a change",
      (await R.sha256(bmHtml)) === (await R.sha256(bmHtml + " ")), false);

// ---- sub-millisecond timestamps must not split one visit into two rows ----
// The browser reports visitTime as a double; an export round-trips it through
// Date.parse(), which yields whole milliseconds. If the store keeps both, the
// same visit exists under two keys - counted twice, exported twice, and merged
// back into one on the next import.
check("collectHistory floors visit times",
      h.allVisits.every(v => Number.isInteger(v.t)), true);
check("fraction does not change the exported timestamp",
      new Date(h.index[0].first).toISOString(), "2026-02-25T10:00:00.000Z");

await D.clearVisits();
const dupUrl = "https://example.com/same-visit";
await D.mergeVisits([{ url: dupUrl, t: 1781646709868.123 }]);   // straight from the API
await D.mergeVisits([{ url: dupUrl, t: 1781646709868 }]);       // read back from an export
check("api and round-tripped timestamp are one visit", await D.countVisits(), 1);
check("stored timestamp is a whole millisecond",
      Number.isInteger((await D.visitsForUrl(dupUrl))[0]), true);
await D.clearVisits();

// ---- run log ----
const L = mods[base + "lib/log.js"];
await L.clearLog();
await L.addLog({ kind: "scheduled", ok: true, files: 4, pages: 10, visits: 20 });
await L.addLog({ kind: "manual", ok: true, files: 7, pages: 11, visits: 25 });
const entries = await L.getLog();
check("log: keeps entries in order", entries.map(e => e.kind).join(","), "scheduled,manual");
check("log: stamps a time", Number.isFinite(entries[0].at), true);
const text = L.logToText(entries);
check("log file is newest first", text.indexOf("manual") < text.indexOf("scheduled"), true);
await L.clearLog();

// A migration note has to survive the context that produced it. The upgrade runs
// wherever the database is opened first - often the popup, which is closed again
// long before the next backup writes the log.
await chrome.storage.local.set({ migrationNotes: ["upgraded somewhere else"] });
await R.flushMigrationNotes();
const afterFlush = await L.getLog();
check("a migration note from another context reaches the log",
      afterFlush.map(e => `${e.kind}:${e.note}`).join(""), "migrated:upgraded somewhere else");
check("a logged migration note is not logged twice",
      (await D.takeMigrationNotes()).length, 0);
await L.clearLog();

log("");
log(fails ? `${fails} FAILURE(S)` : "ALL CHECKS PASSED");
log("--- history-2026-09-13.txt ---");
log(C.historyToText("2026-09-13", h.visits));
log("--- page-index.csv ---");
log(csv);
</script>
