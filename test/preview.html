<!DOCTYPE html><meta charset="utf-8"><title>preview</title>
<script>
  // Throwaway harness: renders the real options page against a stubbed browser
  // API so the layout can be looked at outside an extension. Not shipped.
  const S = { settings: {}, runLog: [] };
  // ?seed={"lastOkAt":...} fills storage before the page's own code reads it, so
  // states that only show up after days of not running can be looked at now.
  try {
    const seed = new URLSearchParams(location.search).get("seed");
    if (seed) Object.assign(S, JSON.parse(seed));
  } catch { /* a broken seed is not worth failing the harness over */ }
  window.chrome = {
    storage: { local: {
      get: k => Promise.resolve(typeof k === "string" ? { [k]: S[k] } :
            Array.isArray(k) ? Object.fromEntries(k.map(x => [x, S[x]])) : { ...S }),
      set: o => { Object.assign(S, o); return Promise.resolve(); },
      remove: k => { for (const x of [].concat(k)) delete S[x]; return Promise.resolve(); }
    }},
    alarms: { create: () => {}, get: () => Promise.resolve(null) },
    action: { setBadgeText: () => Promise.resolve(), setBadgeBackgroundColor: () => Promise.resolve() },
    runtime: { onMessage: { addListener() {} }, getURL: p => p },
    contextMenus: { create() {}, removeAll(cb) { cb && cb(); }, onClicked: { addListener() {} } },
    tabs: { create: () => Promise.resolve() },
    i18n: { getMessage: k => k, getUILanguage: () => "en" }
  };
</script>
<script type="module">
  const html = await (await fetch("../extension/options.html")).text();
  const doc = new DOMParser().parseFromString(html, "text/html");
  for (const style of doc.querySelectorAll("style")) document.head.appendChild(style);
  document.body.innerHTML = doc.body.innerHTML;
  await import("../extension/options.js");
</script>
